<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Penilaian Bahasa Indonesia Kelas VI</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #065f46 0%, #047857 100%); 
            padding: 25px; 
            min-height: 100vh; 
            color: #334155; 
        }

        .container { 
            max-width: 1600px; 
            margin: auto; 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 30px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); 
            padding: 30px; 
        }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 3px dashed #6ee7b7; 
            padding-bottom: 25px; 
            margin-bottom: 25px; 
            flex-wrap: wrap; 
            gap: 20px; 
        }
        .header-title { display: flex; align-items: center; gap: 20px; position: relative; }
        
        .logo-container {
            width: 75px;
            height: 75px;
            background: linear-gradient(135deg, #065f46, #047857); 
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2px; 
            box-shadow: 0 0 20px rgba(6,95,70,0.5);
            animation: pulse-glow 2s infinite;
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }

        .logo-container:hover::after {
            content: "Ubah";
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 10px;
            text-align: center;
            padding: 2px 0;
            font-weight: 600;
        }
        
        .logo-custom { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        
        @keyframes pulse-glow {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(6,95,70,0.5); }
            50% { transform: scale(1.04); box-shadow: 0 0 32px rgba(6,95,70,0.85); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(6,95,70,0.5); }
        }

        .header-title h1 { font-size: 26px; color: #0f172a; font-weight: 700; }
        .header-title p { font-size: 14px; color: #64748b; font-weight: 500; }
        
        .controls-panel { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        
        .select-semester { 
            padding: 12px 20px; 
            border-radius: 16px; 
            border: 2px solid #059669; 
            font-size: 14px; 
            font-weight: 600; 
            color: #047857; 
            outline: none; 
            cursor: pointer; 
            background: #fff;
            box-shadow: 0 4px 10px rgba(5,150,105,0.1);
            transition: all 0.3s;
        }
        .select-semester:hover { background: #ecfdf5; transform: translateY(-1px); }

        .kkm-container {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ecfdf5;
            padding: 6px 14px;
            border-radius: 16px;
            border: 2px solid #10b981;
            box-shadow: 0 4px 10px rgba(16,185,129,0.1);
        }
        .kkm-container label { font-size: 14px; font-weight: 700; color: #047857; }
        .input-kkm {
            width: 55px;
            padding: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #334155;
            outline: none;
        }
        .btn-kkm-save {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-kkm-save:hover { background: #047857; transform: scale(1.05); }

        .btn { 
            padding: 12px 22px; 
            border: none; 
            border-radius: 16px; 
            color: #fff; 
            font-weight: 600; 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            font-size: 14px; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .btn:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        
        .btn-bab-tp { background: linear-gradient(135deg, #d97706, #b45309); }
        .btn-input-pop { background: linear-gradient(135deg, #059669, #047857); animation: bounce-subtle 2s infinite; }
        .btn-excel { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-save { background: linear-gradient(135deg, #06b6d4, #0891b2); }
        .btn-pdf { background: linear-gradient(135deg, #8b5cf6, #6d28d9); } 
        .btn-back { background: linear-gradient(135deg, #f43f5e, #e11d48); }

        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .table-wrap { 
            overflow-x: auto; 
            background: #fff; 
            border-radius: 20px; 
            border: 1px solid #e2e8f0; 
            margin-top: 15px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        
        th { color: #fff; font-weight: 600; padding: 12px 8px; white-space: nowrap; text-align: center; }
        .th-utama { background: #065f46; } 
        .th-bab { background: #047857; font-size: 12px; border-right: 1px solid #6ee7b7; border-bottom: 1px solid #6ee7b7; }
        .th-harian { background: #a7f3d0; font-size: 12px; min-width: 44px; border-right: 1px solid #475569; color: #064e3b; font-weight: 700; cursor: help; } 
        .th-harian:nth-child(even) { background: #10b981; color: #fff; } 
        
        .th-ujian-edit { 
            background: #059669; 
            cursor: pointer;
            position: relative;
            min-width: 80px;
            outline: none;
            transition: background 0.2s;
        } 
        .th-ujian-edit:hover { background: #047857; }
        
        .th-raport { background: #064e3b; font-size: 15px; } 
        
        td { padding: 10px 8px; border-bottom: 1px solid #f1f5f9; text-align: center; }
        tr:nth-child(even) { background-color: #f8fafc; } 
        tr:hover { background-color: #f1f5f9 !important; } 

        .col-no { font-weight: 600; color: #64748b; width: 45px; }
        .col-nis { color: #64748b; width: 65px; font-weight: 500; }
        
        .col-nama { 
            text-align: left; 
            min-width: 240px; 
            font-weight: 500; 
            color: #475569; 
            position: sticky; 
            left: 0; 
            z-index: 2; 
            box-shadow: 4px 0 10px rgba(5,150,105,0.08); 
            border-right: 2px solid #a7f3d0; 
            padding-left: 15px;
        }
        tr:nth-child(odd) .col-nama { background-color: #ecfdf5 !important; }  
        tr:nth-child(even) .col-nama { background-color: #d1fae5 !important; } 
        tr:hover .col-nama { background-color: #a7f3d0 !important; }          

        .nama-container { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .area-badge { display: flex; gap: 4px; align-items: center; }

        .badge-bintang {
            color: #eab308; font-size: 16px; display: inline-block;
            animation: bintang-animasi 1.5s ease-in-out infinite alternate;
            text-shadow: 0 0 8px rgba(234, 179, 8, 0.6);
        }
        .badge-bintang-ungu {
            color: #8b5cf6; font-size: 16px; display: inline-block;
            animation: bintang-animasi 1.5s ease-in-out infinite alternate-reverse;
            text-shadow: 0 0 8px rgba(139, 92, 246, 0.6);
        }
        @keyframes bintang-animasi {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.25) rotate(15deg); }
        }

        .badge-peringatan {
            color: #dc2626; font-size: 16px; display: inline-block;
            animation: peringatan-animasi 0.8s ease-in-out infinite alternate;
            text-shadow: 0 0 8px rgba(220, 38, 38, 0.5);
        }
        @keyframes peringatan-animasi {
            0% { transform: scale(0.95); opacity: 0.6; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .input-nilai { 
            width: 44px; padding: 6px 4px; border: 1px solid #cbd5e1; 
            border-radius: 8px; text-align: center; font-size: 12px; 
            font-weight: 600; outline: none; transition: all 0.2s ease; background: #f8fafc;
        }
        .input-nilai:focus { 
            border-color: #059669; background: #fff; 
            box-shadow: 0 0 0 3px rgba(5,150,105,0.2); transform: scale(1.08);
        }
        .input-nilai::-webkit-outer-spin-button, .input-nilai::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .input-nilai { -moz-appearance: textfield; }

        .lulus-kkm { color: #047857 !important; background: #d1fae5 !important; border-color: #a7f3d0 !important; }
        .gagal-kkm { color: #dc2626 !important; background: #fee2e2 !important; border-color: #fca5a5 !important; }

        .nilai-raport { font-size: 15px; font-weight: 700; padding: 4px 8px; border-radius: 8px; display: inline-block; min-width: 38px; transition: all 0.3s ease; }
        .th-rata-harian, .col-rata-harian { display: none; }

        .kolom-tersembunyi { display: none !important; }

        /* MODAL COMMON STYLE */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; pointer-events: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: linear-gradient(145deg, #ffffff, #f1f5f9);
            width: 90%; max-width: 520px; border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
            padding: 30px; transform: scale(0.8) translateY(20px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid #34d399; position: relative; overflow: hidden;
        }
        .modal-overlay.active .modal-card { transform: scale(1) translateY(0); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { font-size: 22px; font-weight: 800; background: linear-gradient(90deg, #065f46, #059669); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-close-modal { background: #f1f5f9; border: none; font-size: 20px; color: #64748b; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; transition: 0.2s; }
        .btn-close-modal:hover { background: #a7f3d0; color: #065f46; }

        .form-group-modal { margin-bottom: 18px; }
        .form-group-modal label { display: block; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 6px; }
        .select-modal, .input-modal { width: 100%; padding: 12px; border-radius: 14px; border: 2px solid #cbd5e1; font-weight: 600; outline: none; font-size: 14px; background: #fff; transition: 0.2s; }
        .select-modal:focus, .input-modal:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.2); }
        
        .input-locked { background: #e2e8f0 !important; color: #64748b !important; cursor: not-allowed; }

        .status-terisi-info {
            background: #fffbeb;
            border: 1.5px solid #f59e0b;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            color: #b45309;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-unlock-edit {
            background: #f59e0b;
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-unlock-edit:hover { background: #d97706; }

        .tp-info-box {
            background: #ecfdf5;
            border: 2px solid #059669;
            border-radius: 14px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 12px;
            color: #047857;
            box-shadow: 0 2px 6px rgba(5,150,105,0.1);
        }
        .tp-info-box .tp-bab-badge {
            display: inline-block;
            background: #059669;
            color: #fff;
            padding: 2px 8px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 11px;
            margin-bottom: 4px;
        }
        .tp-info-box .tp-desc-text { display: block; font-weight: 600; line-height: 1.4; color: #1e293b; }

        .siswa-box { background: #ecfdf5; border: 2px dashed #34d399; border-radius: 16px; padding: 12px 16px; text-align: center; margin-bottom: 20px; }
        .siswa-box .nama { font-size: 18px; font-weight: 800; color: #065f46; display: block; }
        .siswa-box .nis { font-size: 12px; font-weight: 600; color: #059669; }

        .big-input-wrapper { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 15px 0; }
        .big-input-nilai {
            width: 130px; height: 90px; border-radius: 24px; border: 4px solid #10b981;
            text-align: center; font-size: 44px; font-weight: 800; color: #065f46;
            background: #fff; box-shadow: inset 0 4px 8px rgba(0,0,0,0.05), 0 10px 20px rgba(16,185,129,0.15);
            outline: none; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .big-input-nilai:focus { transform: scale(1.05); border-color: #047857; box-shadow: 0 0 25px rgba(4,120,87,0.35); }

        .absen-dropdown-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .absen-dropdown-box label { font-size: 11px; font-weight: 700; color: #059669; text-transform: uppercase; letter-spacing: 0.5px; }
        .select-absen-angka {
            width: 75px; height: 50px; border-radius: 16px; border: 3px solid #34d399;
            background: #fff; color: #065f46; font-weight: 800; font-size: 22px;
            text-align: center; text-align-last: center; outline: none; cursor: pointer;
            box-shadow: 0 4px 10px rgba(52,211,153,0.15); transition: all 0.2s;
        }

        .modal-footer { display: flex; gap: 10px; justify-content: space-between; margin-top: 15px; }
        .btn-nav { flex: 1; padding: 12px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-nav-prev { background: #e2e8f0; color: #475569; }
        .btn-nav-next { background: linear-gradient(135deg, #065f46, #059669); color: #fff; box-shadow: 0 4px 12px rgba(6,95,70,0.3); }

        #printAreaIndividual { display: none; }

        @media print {
            @page { size: A4 portrait; margin: 12mm 15mm; }
            body { background: #fff !important; color: #000 !important; padding: 0 !important; margin: 0 !important; font-size: 11pt !important; }
            .container, .modal-overlay { display: none !important; }
            #printAreaIndividual { display: block !important; }
            .page-break { page-break-after: always; page-break-inside: avoid; padding-top: 10px; }
            .page-break:last-child { page-break-after: auto; }
            .print-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 3px double #000; padding-bottom: 10px; margin-bottom: 15px; }
            .print-logo { width: 60px; height: 60px; object-fit: contain; }
            .print-header-text { text-align: center; flex: 1; margin: 0 10px; }
            .print-header-text h2 { font-size: 15pt; font-weight: bold; margin-bottom: 2px; text-transform: uppercase; }
            .print-header-text p { font-size: 9pt; margin: 0; color: #333; }
            .print-biodata { width: 100%; border-collapse: collapse; margin-bottom: 15px; background: #fdfdfd; border: 1px solid #ccc; }
            .print-biodata td { padding: 6px 10px; font-size: 10pt; text-align: left; border: none; }
            .print-biodata td.label { font-weight: bold; width: 120px; }
            .print-section-title { font-size: 11pt; font-weight: bold; margin: 12px 0 6px 0; border-left: 4px solid #065f46; padding-left: 8px; }
            table.table-print { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 9.5pt; }
            table.table-print th, table.table-print td { border: 1px solid #000; padding: 6px 8px; text-align: center; }
            table.table-print th { background: #f1f5f9 !important; font-weight: bold; color: #000; }
            table.table-print td.text-left { text-align: left; }
            .print-rekap-summary { width: 100%; border-collapse: collapse; margin-top: 10px; margin-bottom: 20px; }
            .print-rekap-summary th, .print-rekap-summary td { border: 1px solid #000; padding: 8px; text-align: center; font-size: 10pt; }
            .print-rekap-summary th { background: #e2e8f0 !important; }
            .status-lulus { color: #065f46; font-weight: bold; }
            .status-remedi { color: #b91c1c; font-weight: bold; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-title">
            <div class="logo-container" onclick="document.getElementById('inputLogoManual').click();" title="Klik untuk ganti logo manual">
                <img id="tampilanLogo" src="image_480e7c.png" alt="Logo Mapel" class="logo-custom">
            </div>
            <input type="file" id="inputLogoManual" accept="image/*" style="display: none;" onchange="prosesUnggahLogo(this)">
            
            <div>
                <h1>Daftar Nilai Bahasa Indonesia - Kelas VI</h1>
                <p>Mata Pelajaran: Bahasa Indonesia | Top Raport ⭐ | Top Harian ⭐ | Ada Harian &lt; KKM ⚠️</p>
            </div>
        </div>
        
        <div class="controls-panel">
            <div class="kkm-container">
                <label for="kkmInput">KKM:</label>
                <input type="number" id="kkmInput" class="input-kkm" value="75" min="0" max="100" oninput="perbaruiSemuaWarnaKKM()">
                <button class="btn-kkm-save" onclick="simpanKKM()"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
            </div>

            <select id="semesterSelect" class="select-semester" onchange="gantiSemester()">
                <option value="Semester 1">🍂 Semester 1</option>
                <option value="Semester 2">🌸 Semester 2</option>
            </select>
            
            <button class="btn btn-bab-tp" onclick="bukaModalBabTP()"><i class="fa-solid fa-book-open"></i> Kelola Bab & TP</button>
            <button class="btn btn-input-pop" onclick="bukaModalInput()"><i class="fa-solid fa-gamepad"></i> Input Cepat</button>
            <button class="btn btn-pdf" onclick="cetakLaporanPDF()"><i class="fa-solid fa-print"></i> Cetak PDF</button>
            <button class="btn btn-excel" onclick="eksporExcel()"><i class="fa-solid fa-file-excel"></i> Excel</button>
            <button class="btn btn-save" onclick="simpanKeSheets()"><i class="fa-solid fa-cloud-arrow-up"></i> Sheets</button>
            <button class="btn btn-back" onclick="kembaliKeAbsensi()"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
        </div>
    </div>

    <div class="table-wrap">
        <table id="tabelNilaiBahasaIndonesia">
            <thead id="headerRow"></thead>
            <tbody id="bodyNilaiBahasaIndonesia"></tbody>
        </table>
    </div>
</div>

<div id="printAreaIndividual"></div>

<!-- MODAL KELOLA BAB & TP -->
<div class="modal-overlay" id="modalBabTP">
    <div class="modal-card" style="border-color: #059669;">
        <div class="modal-header">
            <h2><i class="fa-solid fa-book-bookmark"></i> Atur Bab & TP</h2>
            <button class="btn-close-modal" onclick="tutupModalBabTP()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div id="infoStatusTerisiContainer"></div>

        <div style="display: flex; gap: 10px;">
            <div class="form-group-modal" style="flex: 1;">
                <label for="selectKolomMulai"><i class="fa-solid fa-angles-right"></i> Dari Kolom:</label>
                <select id="selectKolomMulai" class="select-modal" onchange="muatDataBabTPModal()"></select>
            </div>
            <div class="form-group-modal" style="flex: 1;">
                <label for="selectKolomSelesai"><i class="fa-solid fa-angles-left"></i> Sampai Kolom:</label>
                <select id="selectKolomSelesai" class="select-modal"></select>
            </div>
        </div>

        <div class="form-group-modal">
            <label for="inputJudulBab"><i class="fa-solid fa-layer-group"></i> Label Bab / Topik:</label>
            <input type="text" id="inputJudulBab" class="input-modal" placeholder="Contoh: Bab 1">
        </div>
        <div class="form-group-modal">
            <label for="inputDeskripsiTP"><i class="fa-solid fa-bullseye"></i> Tujuan Pembelajaran (TP):</label>
            <textarea id="inputDeskripsiTP" class="input-modal" style="height: 80px; resize: vertical;" placeholder="Contoh: Memahami isi teks narasi atau laporan."></textarea>
        </div>
        <div class="modal-footer">
            <button class="btn-nav btn-nav-next" style="background: linear-gradient(135deg, #065f46, #059669);" onclick="simpanBabTPModal()">Simpan Bab & TP <i class="fa-solid fa-check"></i></button>
        </div>
    </div>
</div>

<!-- MODAL INPUT NILAI CEPAT -->
<div class="modal-overlay" id="modalInputNilai">
    <div class="modal-card">
        <div class="modal-header">
            <h2><i class="fa-solid fa-wand-magic-sparkles"></i> Mode Input Seru</h2>
            <button class="btn-close-modal" onclick="tutupModalInput()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="form-group-modal">
            <label for="selectTargetKolom"><i class="fa-solid fa-list-check"></i> Pilih Kolom Target Nilai:</label>
            <select id="selectTargetKolom" class="select-modal" onchange="muatNilaiSiswaModal()"></select>
        </div>
        <div class="tp-info-box" id="modalTpBox">
            <span class="tp-bab-badge" id="modalTpBab">Bab 1</span>
            <span class="tp-desc-text" id="modalTpText">Tujuan Pembelajaran 1</span>
        </div>
        <div class="siswa-box">
            <span class="nis" id="modalSiswaNis">NIS: 3052</span>
            <span class="nama" id="modalSiswaNama">Amelia Alita Zahra</span>
        </div>
        <div class="big-input-wrapper">
            <input type="number" id="inputBigNilai" class="big-input-nilai" placeholder="0" min="0" max="100" onkeydown="handleEnterBigInput(event)">
            <div class="absen-dropdown-box">
                <label for="selectNoAbsen"><i class="fa-solid fa-hashtag"></i> Absen</label>
                <select id="selectNoAbsen" class="select-absen-angka" onchange="lompatKeSiswa(this.value)"></select>
            </div>

        <div class="modal-footer">
            <button class="btn-nav btn-nav-prev" onclick="navigasiSiswaModal(-1)"><i class="fa-solid fa-chevron-left"></i> Sebelum</button>

        </div>
    </div>
</div>

<script>
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycby3j4loXE7K53usU4R0zJVDpapB-NkoB9VpD_RKl5tYiQX90PY6qINv16gX78ZVAcUe/exec";

    const MASTER_SISWA_DEFAULT = [
        ["3052","Amelia Alita Zahra"],["3223","Angelica Vikar Maharani"],["3085","Anggraeni Abbilah Dhety"],
        ["3087","AZKA NAILUN NABHAN"],["3088","Cinta Anugrah"],["3089","Dany Sabiq El-Fathin"],
        ["3090","Dhea Fiky Mazaya"],["3224","Earlita Arsyifa Salsabila"],["3091","Fadilla Rizqi Khaerani"],
        ["3092","Fathan Almaizan Zhafar"],["3093","Gavin Harry Wiriawan"],["3063","Hafiz Ardiyansah"],
        ["3095","Intan Berliyan"],["3096","Luthfiya Nur Ramadhani"],["3069","M. Miftah Al Fattah"],
        ["3097","Mugi Aditia Ripki"],["3098","Muh Azzka Alpratama"],["3099","Muhamad Ramadhani"],
        ["3102","Nayla Dwi Syafriani"],["3108","Puteri Ayuning Kirana"],["3103","Raisa Rahmawati Septiani"],
        ["3104","Renita Nur Saefitri"],["3084","Shalwa Aisa Nazwa"],["3105","Wifha Alya An Adibah"],
        ["3106","Zhidan Dwi Aprilio Nurosy"],["3107","Zulfan Azhar Ramadhan"]
    ];

    let SISWA = JSON.parse(localStorage.getItem('dbMasterSiswa')) || MASTER_SISWA_DEFAULT;
    let databaseNilai = JSON.parse(localStorage.getItem('dbNilaiBahasaIndonesia')) || {};
    let databaseBabTP = JSON.parse(localStorage.getItem('dbBabTP_BahasaIndonesia')) || {};
    let indeksSiswaModal = 0;
    let modeEditAktif = false;

    function simpanKKM() {
        const kkmVal = document.getElementById('kkmInput').value;
        if(kkmVal !== "") {
            localStorage.setItem('dbKKMBahasaIndonesia', kkmVal);
            perbaruiSemuaWarnaKKM();
            alert('Nilai KKM (' + kkmVal + ') berhasil disimpan!');
        }
    }

    function muatKKMTersimpan() {
        const kkmLokal = localStorage.getItem('dbKKMBahasaIndonesia');
        if (kkmLokal) { document.getElementById('kkmInput').value = kkmLokal; }
    }

    function prosesUnggahLogo(input) {
        if (input.files && input.files[0]) {
            const pembacaFile = new FileReader();
            pembacaFile.onload = function(e) {
                const hasilBase64 = e.target.result;
                document.getElementById('tampilanLogo').src = hasilBase64;
                localStorage.setItem('dbLogoBahasaIndonesia', hasilBase64);
            };
            pembacaFile.readAsDataURL(input.files[0]);
        }
    }

    function muatLogoTersimpan() {
        const logoLokal = localStorage.getItem('dbLogoBahasaIndonesia');
        if (logoLokal) { document.getElementById('tampilanLogo').src = logoLokal; }
    }

    function inisialisasiTabel() {
        const header = document.getElementById('headerRow');
        const semAktif = document.getElementById('semesterSelect').value;
        
        const txtUTS = localStorage.getItem('istilahUTS_BahasaIndonesia') || 'UTS';
        const txtUAS = localStorage.getItem('istilahUAS_BahasaIndonesia') || 'UAS / US';

        if(!databaseBabTP[semAktif]) { databaseBabTP[semAktif] = {}; }

        let statusKolomAktif = [];
        for(let i = 1; i <= 30; i++) {
            statusKolomAktif[i] = (databaseBabTP[semAktif][i] && databaseBabTP[semAktif][i].bab && databaseBabTP[semAktif][i].bab.trim() !== "");
        }

        let row1 = `<tr><th class="th-utama" rowspan="2">No</th><th class="th-utama" rowspan="2">NIS</th><th class="th-utama col-nama" rowspan="2">Nama Siswa</th>`;
        
        let colIdx = 1;
        while(colIdx <= 30) {
            if (!statusKolomAktif[colIdx]) {
                colIdx++;
                continue;
            }
            let currentBab = databaseBabTP[semAktif][colIdx].bab;
            let span = 1;
            while(colIdx + span <= 30) {
                if (!statusKolomAktif[colIdx + span]) break;
                let nextBab = databaseBabTP[semAktif][colIdx + span].bab;
                if(nextBab === currentBab) { span++; } else { break; }
            }
            row1 += `<th class="th-bab" colspan="${span}">${currentBab}</th>`;
            colIdx += span;
        }

        row1 += `<th class="th-rata-harian" rowspan="2">Rata-rata Harian</th>`;
        row1 += `<th class="th-ujian-edit" rowspan="2" contenteditable="true" id="thUTS" onblur="simpanIstilahLangsung('UTS')">${txtUTS}</th>`;
        row1 += `<th class="th-ujian-edit" rowspan="2" contenteditable="true" id="thUAS" onblur="simpanIstilahLangsung('UAS')">${txtUAS}</th>`;
        row1 += `<th class="th-raport" rowspan="2">RAPORT</th></tr>`;

        let row2 = `<tr>`;
        for(let i = 1; i <= 30; i++) {
            let tpDesc = databaseBabTP[semAktif][i] ? databaseBabTP[semAktif][i].tp : `Tujuan Pembelajaran ${i}`;
            let classHidden = statusKolomAktif[i] ? '' : ' kolom-tersembunyi';
            row2 += `<th class="th-harian${classHidden}" title="${tpDesc}" data-kolom-harian="${i}">${i}</th>`;
        }
        row2 += `</tr>`;

        header.innerHTML = row1 + row2;
        cegahEnterKolom(document.getElementById('thUTS'));
        cegahEnterKolom(document.getElementById('thUAS'));

        const body = document.getElementById('bodyNilaiBahasaIndonesia');
        body.innerHTML = '';

        if(!databaseNilai[semAktif]) { databaseNilai[semAktif] = {}; }

        SISWA.forEach((siswa, index) => {
            const nis = siswa[0];
            const nama = siswa[1];
            const dataSiswa = databaseNilai[semAktif][nis] || { harian: Array(30).fill(''), uts: '', uas: '', raport: '0' };

            let kolomHarian = '';
            let totalNH = 0, jumlahNH = 0;
            for(let j = 0; j < 30; j++) {
                const noKolom = j + 1;
                const nilaiHarianTerisi = dataSiswa.harian[j] !== undefined ? dataSiswa.harian[j] : '';
                let classHiddenCell = statusKolomAktif[noKolom] ? '' : ' kolom-tersembunyi';
                
                kolomHarian += `<td class="col-harian-cell${classHiddenCell}" data-kolom-harian="${noKolom}"><input type="number" class="input-nilai nh" data-index="${j}" min="0" max="100" value="${nilaiHarianTerisi}" oninput="hitungOtomatisRaport(this)"></td>`;
                
                if(statusKolomAktif[noKolom] && nilaiHarianTerisi !== '') { 
                    totalNH += parseFloat(nilaiHarianTerisi); 
                    jumlahNH++; 
                }
            }
            const rerataHarianSiswa = jumlahNH > 0 ? Math.round(totalNH / jumlahNH) : 0;
            const nilaiRaportTeks = dataSiswa.raport || 0;

            body.innerHTML += `
                <tr data-nis="${nis}">
                    <td class="col-no">${index + 1}</td>
                    <td class="col-nis">${nis}</td>
                    <td class="col-nama">
                        <div class="nama-container">
                            <span class="nama-teks">${nama}</span>
                            <span class="area-badge"></span>
                        </div>
                    </td>
                    ${kolomHarian}
                    <td class="col-rata-harian">${rerataHarianSiswa}</td>
                    <td><input type="number" class="input-nilai uts" min="0" max="100" value="${dataSiswa.uts || ''}" oninput="hitungOtomatisRaport(this)"></td>
                    <td><input type="number" class="input-nilai uas" min="0" max="100" value="${dataSiswa.uas || ''}" oninput="hitungOtomatisRaport(this)"></td>
                    <td><b class="nilai-raport">${nilaiRaportTeks}</b></td>
                </tr>
            `;
        });
        
        perbaruiSemuaWarnaKKM();
        evaluasiIndikatorSiswa();
        isiOpsiModalKolom();
        isiOpsiDropdownAbsen();
    }

    function simpanIstilahLangsung(tipe) {
        if (tipe === 'UTS') {
            const text = document.getElementById('thUTS').innerText.trim() || 'UTS';
            localStorage.setItem('istilahUTS_BahasaIndonesia', text);
        } else {
            const text = document.getElementById('thUAS').innerText.trim() || 'UAS / US';
            localStorage.setItem('istilahUAS_BahasaIndonesia', text);
        }
        isiOpsiModalKolom();
    }

    function cegahEnterKolom(elemen) {
        if(!elemen) return;
        elemen.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); elemen.blur(); }
        });
    }

    function hitungOtomatisRaport(element) {
        const baris = element.closest('tr');
        const nis = baris.getAttribute('data-nis');
        const semAktif = document.getElementById('semesterSelect').value;
        
        const inputsNH = baris.querySelectorAll('.nh');
        const inputUTS = baris.querySelector('.uts').value;
        const inputUAS = baris.querySelector('.uas').value;
        
        let totalNH = 0, jumlahNH = 0, susunanNH = [];

        inputsNH.forEach((inp, idx) => {
            const noKolom = idx + 1;
            const val = inp.value;
            susunanNH.push(val);
            
            const isAktif = (databaseBabTP[semAktif] && databaseBabTP[semAktif][noKolom] && databaseBabTP[semAktif][noKolom].bab && databaseBabTP[semAktif][noKolom].bab.trim() !== "");
            if(isAktif && val !== '') { 
                totalNH += parseFloat(val); 
                jumlahNH++; 
            }
        });

        const rataRataNH = jumlahNH > 0 ? (totalNH / jumlahNH) : 0;
        const nilaiUTS = inputUTS !== '' ? parseFloat(inputUTS) : 0;
        const nilaiUAS = inputUAS !== '' ? parseFloat(inputUAS) : 0;

        let hasilRaport = Math.round((rataRataNH * 2 + nilaiUTS + nilaiUAS) / 4);
        if(jumlahNH === 0 && inputUTS === '' && inputUAS === '') hasilRaport = 0;

        baris.querySelector('.nilai-raport').innerText = hasilRaport;
        baris.querySelector('.col-rata-harian').innerText = Math.round(rataRataNH);

        warnaiElemenBerdasarkanIsi(baris);

        databaseNilai[semAktif][nis] = {
            harian: susunanNH, uts: inputUTS, uas: inputUAS, raport: hasilRaport
        };
        localStorage.setItem('dbNilaiBahasaIndonesia', JSON.stringify(databaseNilai));

        evaluasiIndikatorSiswa();
    }

    function evaluasiIndikatorSiswa() {
        const semuaBaris = document.querySelectorAll('#bodyNilaiBahasaIndonesia tr');
        const nilaiKKM = parseFloat(document.getElementById('kkmInput').value) || 0;
        const semAktif = document.getElementById('semesterSelect').value;
        
        let nilaiRaportTertinggi = 0;
        let rataHarianTertinggi = 0;

        semuaBaris.forEach(baris => {
            const areaBadge = baris.querySelector('.area-badge');
            if(areaBadge) areaBadge.innerHTML = ''; 
            
            const nr = parseFloat(baris.querySelector('.nilai-raport').innerText) || 0;
            const rh = parseFloat(baris.querySelector('.col-rata-harian').innerText) || 0;
            
            if(nr > nilaiRaportTertinggi) { nilaiRaportTertinggi = nr; }
            if(rh > rataHarianTertinggi) { rataHarianTertinggi = rh; }
        });

        semuaBaris.forEach(baris => {
            const areaBadge = baris.querySelector('.area-badge');
            if(!areaBadge) return;

            const nr = parseFloat(baris.querySelector('.nilai-raport').innerText) || 0;
            const rh = parseFloat(baris.querySelector('.col-rata-harian').innerText) || 0;
            
            const inputsNH = baris.querySelectorAll('.nh');
            let adaHarianDiBawahKKM = false;
            
            inputsNH.forEach((inp, idx) => {
                const noKolom = idx + 1;
                const isAktif = (databaseBabTP[semAktif] && databaseBabTP[semAktif][noKolom] && databaseBabTP[semAktif][noKolom].bab && databaseBabTP[semAktif][noKolom].bab.trim() !== "");
                if(isAktif && inp.value !== '') {
                    const nilaiHarian = parseFloat(inp.value) || 0;
                    if(nilaiHarian < nilaiKKM) { adaHarianDiBawahKKM = true; }
                }
            });

            let htmlBadge = '';
            if(adaHarianDiBawahKKM) {
                htmlBadge += `<i class="fa-solid fa-triangle-exclamation badge-peringatan" title="Ada nilai harian siswa dibawah KKM!"></i>`;
            }
            if(rh === rataHarianTertinggi && rataHarianTertinggi > 0) {
                htmlBadge += `<i class="fa-solid fa-star badge-bintang-ungu" title="Rata-rata Harian Tertinggi"></i>`;
            }
            if(nr === nilaiRaportTertinggi && nilaiRaportTertinggi >= nilaiKKM && nilaiRaportTertinggi > 0) {
                htmlBadge += `<i class="fa-solid fa-star badge-bintang" title="Nilai Raport Tertinggi"></i>`;
            }
            areaBadge.innerHTML = htmlBadge;
        });
    }

    function warnaiElemenBerdasarkanIsi(baris) {
        const nilaiKKM = parseFloat(document.getElementById('kkmInput').value) || 0;
        baris.querySelectorAll('.input-nilai').forEach(input => {
            input.classList.remove('lulus-kkm', 'gagal-kkm');
            if (input.value !== '') {
                const nilai = parseFloat(input.value) || 0;
                if (nilai >= nilaiKKM) { input.classList.add('lulus-kkm'); } 
                else { input.classList.add('gagal-kkm'); }
            }
        });

        const kotakRaport = baris.querySelector('.nilai-raport');
        if (kotakRaport) {
            const nilaiRaport = parseFloat(kotakRaport.innerText) || 0;
            kotakRaport.classList.remove('lulus-kkm', 'gagal-kkm');
            if (nilaiRaport >= nilaiKKM) { kotakRaport.classList.add('lulus-kkm'); } 
            else { kotakRaport.classList.add('gagal-kkm'); }
        }
    }

    function perbaruiSemuaWarnaKKM() {
        document.querySelectorAll('#bodyNilaiBahasaIndonesia tr').forEach(baris => {
            warnaiElemenBerdasarkanIsi(baris);
        });
        evaluasiIndikatorSiswa();
    }

    function cetakLaporanPDF() {
        const semAktif = document.getElementById('semesterSelect').value;
        const kkmVal = parseFloat(document.getElementById('kkmInput').value) || 75;
        const logoSrc = document.getElementById('tampilanLogo').src;
        const txtUTS = localStorage.getItem('istilahUTS_BahasaIndonesia') || 'UTS';
        const txtUAS = localStorage.getItem('istilahUAS_BahasaIndonesia') || 'UAS / US';

        const konfirmasiSiswa = prompt("Ketik '0' untuk cetak SEMUA SISWA, atau ketik Nomor Absen Siswa (1 - " + SISWA.length + "):", "0");
        if (konfirmasiSiswa === null) return;

        const noAbsenPilihan = parseInt(konfirmasiSiswa);
        let daftarSiswaDicetak = SISWA;
        if (!isNaN(noAbsenPilihan) && noAbsenPilihan > 0 && noAbsenPilihan <= SISWA.length) {
            daftarSiswaDicetak = [SISWA[noAbsenPilihan - 1]];
        }

        const petaBab = {};
        for(let col = 1; col <= 30; col++) {
            if (databaseBabTP[semAktif] && databaseBabTP[semAktif][col] && databaseBabTP[semAktif][col].bab && databaseBabTP[semAktif][col].bab.trim() !== "") {
                const babName = databaseBabTP[semAktif][col].bab;
                const tpDesc = databaseBabTP[semAktif][col].tp;
                if(!petaBab[babName]) petaBab[babName] = [];
                petaBab[babName].push({ colIndex: col - 1, tp: tpDesc });
            }
        }

        const areaCetak = document.getElementById('printAreaIndividual');
        areaCetak.innerHTML = '';

        daftarSiswaDicetak.forEach((siswa) => {
            const nis = siswa[0];
            const nama = siswa[1];
            const baris = document.querySelector(`#bodyNilaiBahasaIndonesia tr[data-nis="${nis}"]`);
            if(!baris) return;

            const inputsNH = baris.querySelectorAll('.nh');
            const valUTS = baris.querySelector('.uts').value || '-';
            const valUAS = baris.querySelector('.uas').value || '-';
            const valRaport = parseFloat(baris.querySelector('.nilai-raport').innerText) || 0;
            const valRerataHarian = parseFloat(baris.querySelector('.col-rata-harian').innerText) || 0;

            let htmlBarisBab = '';
            for(let namaBab in petaBab) {
                const daftarTP = petaBab[namaBab];
                let sumNilai = 0, countNilai = 0;
                let rincianNilaiTP = [];

                daftarTP.forEach((item, tIdx) => {
                    const nilaiVal = inputsNH[item.colIndex].value;
                    if(nilaiVal !== '') {
                        sumNilai += parseFloat(nilaiVal);
                        countNilai++;
                        rincianNilaiTP.push(`TP${tIdx+1}: <b>${nilaiVal}</b>`);
                    } else {
                        rincianNilaiTP.push(`TP${tIdx+1}: -`);
                    }
                });

                const rataBab = countNilai > 0 ? Math.round(sumNilai / countNilai) : '-';
                const statusBab = (rataBab !== '-' && rataBab >= kkmVal) ? `<span class="status-lulus">Tuntas</span>` : `<span class="status-remedi">Perlu Bimbingan</span>`;

                htmlBarisBab += `<tr><td class="text-left"><b>${namaBab}</b></td><td class="text-left">${rincianNilaiTP.join(' | ')}</td><td><b>${rataBab}</b></td><td>${statusBab}</td></tr>`;
            }

            areaCetak.innerHTML += `
                <div class="page-break">
                    <div class="print-header">
                        <img src="${logoSrc}" class="print-logo" alt="Logo">
                        <div class="print-header-text">
                            <h2>LAPORAN HASIL BELAJAR SISWA</h2>
                            <p>MATA PELAJARAN BAHASA INDONESIA - KELAS VI (${semAktif})</p>
                        </div>
                    </div>
                    <table class="print-biodata">
                        <tr><td class="label">Nama Siswa</td><td>: <b>${nama}</b></td><td class="label">NIS</td><td>: ${nis}</td></tr>
                    </table>
                    <div class="print-section-title">Rekapitulasi Nilai Per Bab / Topik</div>
                    <table class="table-print">
                        <thead><tr><th>Nama Bab</th><th>Rincian TP</th><th>Rata-Rata</th><th>Status</th></tr></thead>
                        <tbody>${htmlBarisBab}</tbody>
                    </table>
                    <table class="print-rekap-summary">
                        <thead><tr><th>Rata-Rata Harian</th><th>${txtUTS}</th><th>${txtUAS}</th><th>RAPORT</th></tr></thead>
                        <tbody><tr><td><b>${valRerataHarian}</b></td><td><b>${valUTS}</b></td><td><b>${valUAS}</b></td><td><b>${valRaport}</b></td></tr></tbody>
                    </table>
                </div>
            `;
        });

        window.print();
    }

    /* --- FITUR MODAL KELOLA BAB & TP (DENGAN PENGUNCI OTOMATIS & TOMBOL EDIT) --- */
    function bukaModalBabTP() {
        const selectMulai = document.getElementById('selectKolomMulai');
        const selectSelesai = document.getElementById('selectKolomSelesai');
        selectMulai.innerHTML = '';
        selectSelesai.innerHTML = '';
        
        for (let i = 1; i <= 30; i++) {
            selectMulai.innerHTML += `<option value="${i}">Kolom ${i}</option>`;
            selectSelesai.innerHTML += `<option value="${i}">Kolom ${i}</option>`;
        }
        selectSelesai.value = "1";
        
        modeEditAktif = false;
        document.getElementById('modalBabTP').classList.add('active');
        muatDataBabTPModal();
    }

    function tutupModalBabTP() { 
        document.getElementById('modalBabTP').classList.remove('active'); 
    }

    function muatDataBabTPModal() {
        const semAktif = document.getElementById('semesterSelect').value;
        const colIdx = document.getElementById('selectKolomMulai').value;
        const selectSelesai = document.getElementById('selectKolomSelesai');
        
        selectSelesai.value = colIdx;

        const data = (databaseBabTP[semAktif] && databaseBabTP[semAktif][colIdx]) 
            ? databaseBabTP[semAktif][colIdx] 
            : { bab: '', tp: '' };

        const inputBab = document.getElementById('inputJudulBab');
        const inputTP = document.getElementById('inputDeskripsiTP');
        const containerInfo = document.getElementById('infoStatusTerisiContainer');

        inputBab.value = data.bab;
        inputTP.value = data.tp;

        const sudahTerisi = (data.bab && data.bab.trim() !== "");

        if (sudahTerisi && !modeEditAktif) {
            inputBab.classList.add('input-locked');
            inputTP.classList.add('input-locked');
            selectSelesai.classList.add('input-locked');
            inputBab.readOnly = true;
            inputTP.readOnly = true;
            selectSelesai.disabled = true;

            containerInfo.innerHTML = `
                <div class="status-terisi-info">
                    <span><i class="fa-solid fa-lock"></i> Kolom ini sudah terisi Bab & TP. Terkunci dari perubahan.</span>
                    <button class="btn-unlock-edit" onclick="aktifkanModeEdit()"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                </div>
            `;
        } else {
            inputBab.classList.remove('input-locked');
            inputTP.classList.remove('input-locked');
            selectSelesai.classList.remove('input-locked');
            inputBab.readOnly = false;
            inputTP.readOnly = false;
            selectSelesai.disabled = false;

            if (sudahTerisi && modeEditAktif) {
                containerInfo.innerHTML = `
                    <div class="status-terisi-info" style="background:#ecfdf5; border-color:#059669; color:#047857;">
                        <span><i class="fa-solid fa-unlock"></i> Mode Edit Aktif. Silakan ubah data Bab & TP.</span>
                    </div>
                `;
            } else {
                containerInfo.innerHTML = '';
            }
        }
    }

    function aktifkanModeEdit() {
        modeEditAktif = true;
        muatDataBabTPModal();
    }

    function simpanBabTPModal() {
        const semAktif = document.getElementById('semesterSelect').value;
        const colMulai = parseInt(document.getElementById('selectKolomMulai').value);
        const colSelesai = parseInt(document.getElementById('selectKolomSelesai').value);
        
        const babVal = document.getElementById('inputJudulBab').value.trim();
        const tpVal = document.getElementById('inputDeskripsiTP').value.trim();

        if (colMulai > colSelesai) {
            alert("Kolom 'Dari' tidak boleh lebih besar dari kolom 'Sampai'!");
            return;
        }

        if(!databaseBabTP[semAktif]) databaseBabTP[semAktif] = {};

        for (let i = colMulai; i <= colSelesai; i++) {
            databaseBabTP[semAktif][i] = { bab: babVal, tp: tpVal };
        }

        localStorage.setItem('dbBabTP_BahasaIndonesia', JSON.stringify(databaseBabTP));
        inisialisasiTabel();
        tutupModalBabTP();
        alert(`Berhasil memperbarui Bab & TP untuk rentang Kolom ${colMulai} sampai ${colSelesai}!`);
    }

    /* --- FITUR MODAL INPUT CEPAT --- */
    function isiOpsiModalKolom() {
        const select = document.getElementById('selectTargetKolom');
        select.innerHTML = '';
        for (let i = 1; i <= 30; i++) {
            select.innerHTML += `<option value="harian_${i-1}">Kolom Harian Ke-${i}</option>`;
        }
        const txtUTS = localStorage.getItem('istilahUTS_BahasaIndonesia') || 'UTS';
        const txtUAS = localStorage.getItem('istilahUAS_BahasaIndonesia') || 'UAS / US';

        select.innerHTML += `<option value="uts">31. Ujian UTS (${txtUTS})</option>`;
        select.innerHTML += `<option value="uas">32. Ujian US / UAS (${txtUAS})</option>`;
    }

    function isiOpsiDropdownAbsen() {
        const selectAbsen = document.getElementById('selectNoAbsen');
        if(!selectAbsen) return;
        selectAbsen.innerHTML = '';
        SISWA.forEach((_, idx) => {
            selectAbsen.innerHTML += `<option value="${idx}">${idx + 1}</option>`;
        });
    }

    function bukaModalInput() {
        indeksSiswaModal = 0;
        document.getElementById('modalInputNilai').classList.add('active');
        muatNilaiSiswaModal();
    }

    function tutupModalInput() { document.getElementById('modalInputNilai').classList.remove('active'); }

    function muatNilaiSiswaModal() {
        if(SISWA.length === 0) return;
        const siswa = SISWA[indeksSiswaModal];
        const nis = siswa[0];
        const nama = siswa[1];

        document.getElementById('modalSiswaNis').innerText = `NIS: ${nis}`;
        document.getElementById('modalSiswaNama').innerText = nama;
        
        const selectAbsen = document.getElementById('selectNoAbsen');
        if(selectAbsen) selectAbsen.value = indeksSiswaModal;

        const targetKolom = document.getElementById('selectTargetKolom').value;
        const barisSiswa = document.querySelector(`#bodyNilaiBahasaIndonesia tr[data-nis="${nis}"]`);
        const semAktif = document.getElementById('semesterSelect').value;

        const modalTpBab = document.getElementById('modalTpBab');
        const modalTpText = document.getElementById('modalTpText');

        if(targetKolom.startsWith('harian_')) {
            const colNum = parseInt(targetKolom.split('_')[1]) + 1;
            const dataBabTP = (databaseBabTP[semAktif] && databaseBabTP[semAktif][colNum])
                ? databaseBabTP[semAktif][colNum]
                : { bab: 'Belum Diatur', tp: 'Belum ada Tujuan Pembelajaran' };
            
            modalTpBab.innerText = `${dataBabTP.bab || 'Belum Diatur'} - Kolom ${colNum}`;
            modalTpText.innerText = dataBabTP.tp || 'Belum diisi guru';
        } else if(targetKolom === 'uts') {
            modalTpBab.innerText = "Ujian Tengah Semester";
            modalTpText.innerText = "Penilaian Evaluasi UTS";
        } else {
            modalTpBab.innerText = "Ujian Akhir Semester";
            modalTpText.innerText = "Penilaian Evaluasi UAS / US";
        }

        let inputAsli;
        if(targetKolom.startsWith('harian_')) {
            const idx = targetKolom.split('_')[1];
            inputAsli = barisSiswa.querySelectorAll('.nh')[idx];
        } else if(targetKolom === 'uts') {
            inputAsli = barisSiswa.querySelector('.uts');
        } else {
            inputAsli = barisSiswa.querySelector('.uas');
        }

        const inputBig = document.getElementById('inputBigNilai');
        inputBig.value = inputAsli ? inputAsli.value : '';
        setTimeout(() => { inputBig.focus(); inputBig.select(); }, 100);
    }

    function simpanNilaiDariModal() {
        if(SISWA.length === 0) return;
        const nis = SISWA[indeksSiswaModal][0];
        const targetKolom = document.getElementById('selectTargetKolom').value;
        const valBaru = document.getElementById('inputBigNilai').value;
        const barisSiswa = document.querySelector(`#bodyNilaiBahasaIndonesia tr[data-nis="${nis}"]`);

        let inputAsli;
        if(targetKolom.startsWith('harian_')) {
            const idx = targetKolom.split('_')[1];
            inputAsli = barisSiswa.querySelectorAll('.nh')[idx];
        } else if(targetKolom === 'uts') {
            inputAsli = barisSiswa.querySelector('.uts');
        } else {
            inputAsli = barisSiswa.querySelector('.uas');
        }

        if(inputAsli) {
            inputAsli.value = valBaru;
            hitungOtomatisRaport(inputAsli);
        }
    }

    function lompatKeSiswa(targetIdx) {
        simpanNilaiDariModal();
        indeksSiswaModal = parseInt(targetIdx);
        muatNilaiSiswaModal();
    }

    function navigasiSiswaModal(direction) {
        simpanNilaiDariModal();
        indeksSiswaModal += direction;
        if (indeksSiswaModal < 0) {
            indeksSiswaModal = SISWA.length - 1;
        } else if (indeksSiswaModal >= SISWA.length) {
            indeksSiswaModal = 0;
        }
        muatNilaiSiswaModal();
    }

    function handleEnterBigInput(e) {
        if(e.key === 'Enter') {
            e.preventDefault();
            navigasiSiswaModal(1);
        }
    }

    function gantiSemester() { inisialisasiTabel(); }

    function kembaliKeAbsensi() {
        if (window.opener && !window.opener.closed) { window.close(); } 
        else { window.location.href = 'PENA MANTAP.html'; }
    }

    function eksporExcel() {
        const semAktif = document.getElementById('semesterSelect').value;
        const workbook = XLSX.utils.table_to_book(document.getElementById('tabelNilaiBahasaIndonesia'), { raw: true });
        XLSX.writeFile(workbook, `Nilai_BahasaIndonesia_Kelas6_${semAktif.replace(' ', '')}.xlsx`);
    }

    function simpanKeSheets() {
        const semAktif = document.getElementById('semesterSelect').value;
        const dataPaket = [];

        document.querySelectorAll('#bodyNilaiBahasaIndonesia tr').forEach(baris => {
            dataPaket.push({
                nis: baris.getAttribute('data-nis'),
                nama: baris.querySelector('.col-nama .nama-teks').innerText,
                harian: Array.from(baris.querySelectorAll('.nh')).map(i => i.value || ""),
                uts: baris.querySelector('.uts').value || "",
                uas: baris.querySelector('.uas').value || "",
                raport: baris.querySelector('.nilai-raport').innerText
            });
        });

        if(!confirm(`Kirim & Simpan data nilai Bahasa Indonesia [ ${semAktif} ] langsung ke Google Sheets?`)) return;

        const btn = document.querySelector('.btn-save');
        btn.innerHTML = "⏳ Proses Menyimpan..."; btn.disabled = true;

        const dataForm = new URLSearchParams();
        dataForm.append("postData", JSON.stringify({ data: dataPaket, semester: semAktif, mapel: "Bahasa Indonesia" }));

        fetch(URL_APPS_SCRIPT, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: dataForm
        })
        .then(() => {
            alert(`Data Nilai Bahasa Indonesia (${semAktif}) sukses diproses!`);
        })
        .catch(() => { 
            alert("Proses pengiriman selesai!"); 
        })
        .finally(() => {
            btn.innerHTML = "<i class='fa-solid fa-cloud-arrow-up'></i> Sheets";
            btn.disabled = false;
        });
    }

    window.onload = function() {
        muatKKMTersimpan();
        muatLogoTersimpan();
        inisialisasiTabel();
    };
</script>
</body>
</html>
