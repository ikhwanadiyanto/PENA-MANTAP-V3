<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang - PENA (Pengelolaan Nilai & Administrasi)</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a1c4fd 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Dekorasi Elemen Gelembung Latar Belakang */
        .bubble {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            animation: float 12s infinite ease-in-out;
            z-index: 1;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 50px 30px;
            border-radius: 40px;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            border: 4px solid #ffffff;
            width: 100%;
            max-width: 1300px; /* Diperlebar maksimal agar 6 menu muat berjejer */
            position: relative;
            z-index: 2;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .logo {
            width: 120px;
            height: auto;
            filter: drop-shadow(0px 8px 10px rgba(0,0,0,0.1));
            animation: bounce 3s infinite ease-in-out;
            margin-bottom: 10px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-family: 'Comic Neue', cursive;
            font-weight: 700;
            font-size: 2.8rem;
            color: #4a4a4a;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #7a7a7a;
            font-weight: 600;
            margin-bottom: 40px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4, #45aaf2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-title {
            font-family: 'Comic Neue', cursive;
            font-size: 1.6rem;
            color: #555;
            text-align: left;
            margin: 20px 0 15px 5px;
            font-weight: 700;
        }

        .section-title.mystery-title {
            color: #2c3e50;
            margin-top: 40px;
        }

        /* LAYOUT GRID UTAMA: 6 Menu Berjejer Sejajar (Desktop) */
        .grid-6 {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
        }

        .card-kelas {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px 10px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            box-shadow: 0 8px 15px rgba(0,0,0,0.08);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 3px solid #ffffff;
            position: relative;
            overflow: hidden;
        }

        .card-kelas i {
            font-size: 2.5rem;
            margin-bottom: 12px;
            transition: transform 0.3s;
        }

        .card-kelas span {
            font-family: 'Comic Neue', cursive;
            font-size: 1.2rem;
            white-space: nowrap;
        }

        /* Warna Ceria Baris Atas & Menu Terbuka */
        .kelas-1 { background: linear-gradient(135deg, #ff6b6b, #ff8e8e); }
        .kelas-2 { background: linear-gradient(135deg, #ff9f43, #ffbd7a); }
        .kelas-3 { background: linear-gradient(135deg, #feca57, #ffdd67); }
        .kelas-4 { background: linear-gradient(135deg, #1dd1a1, #10ac84); }
        .kelas-5 { background: linear-gradient(135deg, #48dbfb, #00d2d3); }
        .kelas-6 { background: linear-gradient(135deg, #54a0ff, #5f27cd); }
        
        /* Warna Ceria Khusus Menu Terbuka */
        .kelas-denah { background: linear-gradient(135deg, #3b82f6, #06b6d4); }
        .kelas-nilai { background: linear-gradient(135deg, #10b981, #059669); }
        .kelas-ujian { background: linear-gradient(135deg, #a855f7, #ec4899); }

        /* GAYA MENU MISTERI (BARIS BAWAH) */
        .card-mystery {
            background: linear-gradient(135deg, #2c3e50 0%, #0f172a 100%);
            border: 3px solid #334155;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            cursor: help;
        }

        /* Efek text & icon neon rahasia */
        .card-mystery i {
            color: #94a3b8;
            animation: pulse-icon 2s infinite ease-in-out;
        }

        .card-mystery span {
            color: #64748b;
            font-style: italic;
        }

        @keyframes pulse-icon {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1) rotate(5deg); opacity: 1; color: #f43f5e; filter: drop-shadow(0 0 8px #f43f5e); }
        }

        /* Hover Effects */
        .card-kelas:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 15px 25px rgba(0,0,0,0.15);
        }

        .card-kelas:hover i {
            transform: scale(1.2) rotate(8deg);
        }

        /* Hover khusus menu misteri */
        .card-mystery:hover {
            background: linear-gradient(135deg, #1e1e2f 0%, #000000 100%);
            border-color: #f43f5e;
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.4);
        }
        
        .card-mystery:hover span {
            color: #f43f5e;
        }

        /* Hiasan Pola Lingkaran */
        .card-kelas::after {
            content: '';
            position: absolute;
            top: -20px;
            right: -20px;
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }

        /* RESPONSIVE LAYOUT: Menyesuaikan Layar Kecil */
        @media (max-width: 1100px) {
            .grid-6 {
                grid-template-columns: repeat(3, 1fr); /* Menjadi 3 kolom di tablet */
                gap: 20px;
            }
        }

        @media (max-width: 650px) {
            .grid-6 {
                grid-template-columns: repeat(2, 1fr); /* Menjadi 2 kolom di HP */
                gap: 15px;
            }
            h1 { font-size: 2rem; }
            .container { padding: 30px 15px; }
        }
    </style>
</head>
<body>

    <div class="bubble" style="width: 80px; height: 80px; top: 10%; left: 5%; animation-duration: 8s;"></div>
    <div class="bubble" style="width: 120px; height: 120px; bottom: 15%; left: 8%; animation-duration: 14s;"></div>
    <div class="bubble" style="width: 100px; height: 100px; top: 20%; right: 7%; animation-duration: 10s;"></div>
    <div class="bubble" style="width: 70px; height: 70px; bottom: 8%; right: 12%; animation-duration: 7s;"></div>

    <div class="container">
        <div class="logo-wrapper">
            <img src="logo.png" alt="Logo Aplikasi" class="logo" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'48\' fill=\'%23ff7675\'/><path d=\'M30,40 Q50,20 70,40 L65,75 Q50,85 35,75 Z\' fill=\'%23ffeaa7\'/><circle cx=\'40\' cy=\'45\' r=\'5\' fill=\'%232d3436\'/><circle cx=\'60\' cy=\'45\' r=\'5\' fill=\'%232d3436\'/><path d=\'M42,60 Q50,68 58,60\' stroke=\'%232d3436\' stroke-width=\'4\' fill=\'none\'/></svg>';">
        </div>
        
        <h1>Aplikasi PENA</h1>
        <div class="subtitle">Pengelolaan Nilai dan Administrasi Kelas Interaktif</div>
        
        <div class="section-title">✨ Menu Tingkat Kelas</div>
        <div class="grid-6">
            <a href="#" class="card-kelas kelas-1">
                <i class="fa-solid fa-face-smile-beam"></i>
                <span>Kelas 1</span>
            </a>
            <a href="#" class="card-kelas kelas-2">
                <i class="fa-solid fa-shapes"></i>
                <span>Kelas 2</span>
            </a>
            <a href="#" class="card-kelas kelas-3">
                <i class="fa-solid fa-palette"></i>
                <span>Kelas 3</span>
            </a>
            <a href="#" class="card-kelas kelas-4">
                <i class="fa-solid fa-rocket"></i>
                <span>Kelas 4</span>
            </a>
            <a href="#" class="card-kelas kelas-5">
                <i class="fa-solid fa-flask-vial"></i>
                <span>Kelas 5</span>
            </a>
            <a href="PENA MANTAP.html" class="card-kelas kelas-6">
                <i class="fa-solid fa-graduation-cap"></i>
                <span>Kelas 6</span>
            </a>
        </div>

        <!-- Judul Bagian Pendukung Guru Kelas 6 -->
        <div class="section-title mystery-title">👨‍🏫 Menu Pendukung Guru Kelas 6</div>
        <div class="grid-6">
            <a href="#" class="card-kelas card-mystery">
                <i class="fa-solid fa-user-secret"></i>
                <span>Misteri 1</span>
            </a>
            <a href="#" class="card-kelas card-mystery">
                <i class="fa-solid fa-key"></i>
                <span>Misteri 2</span>
            </a>
            
            <!-- MENU MISTERI 3 SUDAH DIBUKA (DENAH TEMPAT DUDUK) -->
            <a href="Denah Tempat Duduk Ujian.html" class="card-kelas kelas-denah">
                <i class="fa-solid fa-chair"></i>
                <span>Denah Duduk</span>
            </a>

            <a href="#" class="card-kelas card-mystery">
                <i class="fa-solid fa-box-archive"></i>
                <span>Misteri 4</span>
            </a>
            <a href="Nilai Ujian.html" class="card-kelas kelas-nilai">
                <i class="fa-solid fa-file-signature"></i>
                <span>Nilai Ujian</span>
            </a>
            <a href="Rumah Kartu Ujian.html" class="card-kelas kelas-ujian">
                <i class="fa-solid fa-id-card"></i>
                <span>Kartu Ujian</span>
            </a>
        </div>
    </div>

    <audio id="kelasSound" src="sergequadrado-child-says-ok-113118.mp3" preload="auto"></audio>
    <audio id="mysterySound" src="freesound_community-no-84725.mp3" preload="auto"></audio>

    <script>
        // --- KONTROL SUARA MENU KELAS & MENU TERBUKA (KLIK) ---
        const normalMenus = document.querySelectorAll('.card-kelas:not(.card-mystery)');
        const kelasSound = document.getElementById('kelasSound');

        normalMenus.forEach(menu => {
            menu.addEventListener('click', (e) => {
                const targetUrl = menu.getAttribute('href');
                
                if (targetUrl && targetUrl !== '#') {
                    e.preventDefault();
                    
                    kelasSound.currentTime = 0;
                    kelasSound.play().catch(error => {
                        window.location.href = targetUrl;
                    });

                    kelasSound.onended = function() {
                        window.location.href = targetUrl;
                    };
                } else {
                    kelasSound.currentTime = 0; 
                    kelasSound.play().catch(error => {
                        console.log("Pemutaran suara diblokir browser sebelum ada interaksi.");
                    });
                    kelasSound.onended = null;
                }
            });
        });

        // --- KONTROL SUARA MENU MISTERI (SENTUH / HOVER) ---
        const mysteryMenus = document.querySelectorAll('.card-mystery');
        const mysterySound = document.getElementById('mysterySound');

        mysteryMenus.forEach(menu => {
            menu.addEventListener('mouseenter', () => {
                mysterySound.currentTime = 0;
                mysterySound.play().catch(error => {
                    console.log("Browser membutuhkan klik pertama pada halaman sebelum suara hover bisa berbunyi.");
                });
            });
        });
    </script>

</body>
</html>
